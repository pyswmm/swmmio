[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swmmio"
dynamic = ["version"]
description = "Tools for interacting with, editing, and visualizing EPA SWMM5 models"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT License"}
authors = [
    {name = "Adam Erispaha", email = "aerispaha@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
keywords = ["swmm", "stormwater", "modeling", "epa"]

dependencies = [
    "Pillow>=13.0.0",
    "numpy>=1.26",
    "pandas>=0.24.2",
    "pyshp>=2.1.0",
    "geojson>=2.4.1",
    "networkx>=2.3",
    "pyyaml>=3.12",
    "pyproj>=3.0.0",
    "requests>=2.32.3",
    "typing_extensions>=4.12.2",
    "pyswmm>=1.2",
]

[project.optional-dependencies]
graphics = [
    "geopandas",
    "matplotlib",
]

[project.urls]
Homepage = "https://github.com/pyswmm/swmmio"
Repository = "https://github.com/pyswmm/swmmio"
"Bug Tracker" = "https://github.com/pyswmm/swmmio/issues"

[project.scripts]
swmmio_run = "swmmio.run_models.run:run_simple"

[tool.hatch.version]
path = "swmmio/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["swmmio"]

[tool.hatch.build]
include = [
    "swmmio/**/*.py",
    "swmmio/run_models/inp_settings/*.txt",
    "swmmio/reporting/basemaps/*.html",
    "swmmio/graphics/fonts/*.ttf",
    "swmmio/defs/*.json",
    "swmmio/defs/*.yml",
    "swmmio/tests/data/*.inp",
    "swmmio/tests/data/*.rpt",
    "swmmio/tests/data/*.csv",
    "swmmio/tests/data/*.txt",
]
exclude = [

]

[tool.pytest.ini_options]
testpaths = ["swmmio/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "uses_geopandas: marks tests that use Geopandas (deselect with '-m \"not uses_geopandas\"')",
    "serial",
]
filterwarnings = [
    "ignore:.*section not found in.*:UserWarning",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
ignore = [
  "COM812", # Missing trailing comma (covered by formatting)
  "D205",   # 1 blank line required between summary line and description
  "D301",   # Use r""" if any backslashes in a docstring
  "D400",   # First docstring line should end with a period
  "D202",   # No blank lines allowed after function docstring
  "D401",   # First line of docstring should be in imperative mood
  "F401",   # Unused import
  "D101",   # Missing docstring in public class (typically we use __init__ to document class)
  "D105",   # Missing docstring in magic method (these are private, don't enfoce docstrings)
  "ANN002", # Missing type annotation for *args
  "ANN003", # Missing type annotation for **kwargs
  "ANN204", # Missing return type annotation for special method `__init__`
  "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
]
[tool.ruff.lint.per-file-ignores]
"docs/**/*.ipynb" = [
    "C408",    # Unnecessary `dict()` call
]

[dependency-groups]
dev = [
    "swmmio[graphics]",
    "pytest>=8.0",
    "ruff",
]
docs = [
    "sphinx>=7.2.6",
    "sphinx_design>=0.5.0",
    "pydata-sphinx-theme>=0.15.2",
    "sphinx_copybutton>=0.5.2",
    "ipython>=8.18.1",
    "myst-parser>=3.0.1",
    "myst-nb>=1.1.2",
    "numpydoc>=1.8.0",
]
